name: Proposer un paquet
description: Suggérer un skill, un agent ou un connecteur à ajouter au catalogue
title: "[Paquet] "
labels: ["paquet"]
body:
  - type: input
    id: nom
    attributes:
      label: Nom du paquet
      description: En minuscules, chiffres et tirets, de 3 à 50 caractères (ex. redaction-rapport).
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [skill, agent, connecteur]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: À quoi sert-il ?
      description: Quand l'utiliser, quand ne pas l'utiliser (une ou deux phrases).
    validations:
      required: true
  - type: textarea
    id: contenu
    attributes:
      label: Contenu proposé
      description: Collez ici le texte du skill ou de l'agent. Rien de confidentiel, le dépôt est public.
  - type: checkboxes
    id: assistants
    attributes:
      label: Assistants prévus
      description: Pour lesquels le paquet est écrit. La compatibilité reste « jamais testée » tant qu'un essai réel n'est pas consigné.
      options:
        - label: Claude
        - label: Copilot
        - label: OpenCode
  - type: checkboxes
    id: verifs
    attributes:
      label: Vérifications
      options:
        - label: Le contenu ne contient aucun secret ni donnée interne.
          required: true
